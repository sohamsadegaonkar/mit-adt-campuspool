# Production service specification — intentionally NOT synced or deployed.
# Matches the existing Render Docker service in Singapore. No automatic deploy.
# Production promotion remains blocked by independent data recovery, provider
# delivery and migration validation. Do not point this at staging PostgreSQL.
services:
  - type: web
    name: mit-adt-campuspool
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.2"
      - key: PORT
        value: "10000"
      # HTTPS transactional mail only; sender must be verified by provider.
      # Credentials are private settings on the existing Render Docker service.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OTP_SECRET
        sync: false
      # Before a separately approved PostgreSQL production migration, keep
      # existing live backend settings unchanged. Configure PG identity/rides
      # and isolated credentials in Render only after verified recovery.
