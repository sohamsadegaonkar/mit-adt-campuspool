services:
  - type: web
    name: mit-adt-campuspool
    env: node
    plan: free
    autoDeployTrigger: 'off'
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: PORT
        value: "10000"
      # HTTPS transactional mail only: configure an externally verified sender.
      # The live Docker service must be configured privately in Render.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OTP_SECRET
        generateValue: true
