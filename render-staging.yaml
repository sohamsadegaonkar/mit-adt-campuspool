# Optional, manually created staging Blueprint. NOT linked to production.
# In Render > New > Blueprint, explicitly select THIS file and main.
# Creating the file does not create/deploy a service.
services:
  - type: web
    runtime: node
    name: mit-adt-campuspool-staging
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: NODE_VERSION
        value: "22.23.2"
      - key: ENABLE_CLUSTER
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/campuspool-staging.db
      - key: OTP_SECRET
        generateValue: true
      - key: AUTH_OTP_BACKEND
        value: postgres
      # Explicit staging-only switch after the additive PostgreSQL rides migration.
      - key: RIDES_BACKEND
        value: postgres
      - key: OTP_DATABASE_URL
        sync: false
      - key: OTP_HMAC_KEY
        sync: false
      - key: OTP_DB_SSL
        value: "true"
      # Trust the Supabase CA downloaded from the project's Database -> SSL Configuration.
      # The certificate is uploaded privately as a Render Secret File under this filename.
      # Do not disable TLS verification or commit a certificate from an unverified source.
      - key: NODE_EXTRA_CA_CERTS
        value: /etc/secrets/campuspool-supabase-ca.crt
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STAGING_BASIC_AUTH_PASSWORD
        sync: false
      # Explicitly disabled until a staging-only approved MSG91 sender/template is configured.
      - key: SMS_PROVIDER
        value: disabled
      - key: MSG91_AUTHKEY
        sync: false
      - key: MSG91_FLOW_TEMPLATE_ID
        sync: false
