name: Staging live unauthenticated HTTP smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/staging-live-smoke.yml

permissions:
  contents: read

jobs:
  public-staging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify health and staging access gate without secrets
        shell: bash
        run: |
          set -euo pipefail
          base="https://mit-adt-campuspool-staging.onrender.com"
          # Render Free may take time to wake up. Never log response bodies.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 12 --max-time 55 "$base/healthz" || true)
            if [[ "$status" == "200" ]]; then break; fi
            sleep 6
          done
          echo "GET /healthz status: $status"
          test "$status" = "200"
          root=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 25 "$base/")
          echo "GET / status: $root"
          test "$root" = "401"
          auth=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 25 "$base/api/auth/me")
          echo "GET /api/auth/me status: $auth"
          test "$auth" = "401"
          echo "Staging live health and Basic Auth protection verified"
