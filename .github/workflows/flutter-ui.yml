name: Flutter UI checks

on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ui.yml'
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ui.yml'

permissions:
  contents: read

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Widget and quote tests
        working-directory: flutter_app
        run: flutter test
