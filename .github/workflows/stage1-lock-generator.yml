name: Generate package lock for Stage 1 PR
on:
  push:
    branches:
      - feature/stage1-postgres-otp
    paths:
      - package.json
      - .github/workflows/stage1-lock-generator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned dependency graph for review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "LOCK_START"
          base64 -w0 package-lock.json
          echo
          echo "LOCK_END"
