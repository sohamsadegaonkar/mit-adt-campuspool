name: Azure GHCR isolated auth probe offline guard

on:
  push:
    branches:
      - ops/backup-three-gates-evidence-2026-11-06
    paths:
      - 'scripts/azure-ghcr-auth-probe-operator.py'
      - 'scripts/azure-ghcr-pull-proof-job-operator.py'
      - 'scripts/azure-ghcr-pull-proof-readonly-plan.py'
      - 'scripts/azure-ghcr-secret-scope-rbac-operator.py'
      - 'scripts/azure-ghcr-secret-scope-rbac-plan.py'
      - 'test_azure_ghcr_auth_probe_operator.py'
      - '.github/workflows/azure-ghcr-auth-probe-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-manual-only-safety-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Compile and validate synthetic cases (no real PAT, Azure or network)
        run: |
          python3 -m py_compile scripts/azure-ghcr-auth-probe-operator.py
          python3 -m unittest -v test_azure_ghcr_auth_probe_operator.py
      - name: Verify this workflow does not call Azure, GHCR or publish any image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('scripts/azure-ghcr-auth-probe-operator.py').read_text()
          workflow=Path('.github/workflows/azure-ghcr-auth-probe-offline-ci.yml').read_text()
          assert 'START_ONE_GHCR_AUTH_PROBE_NO_DB_BLOB' in script
          assert 'GHCR_AUTH_PROBE_PINNED_MANIFEST_READ_PASS=YES' in script
          assert 'SECRET_URL = proof.VAULT_URL' in script
          assert 'replicaRetryLimit' in script
          assert 'ghcr-auth-probe-only' in script
          assert 'GHCR_PROBE_TOKEN' in script
          assert 'NO_AZURE_WRITE_OR_JOB_START=YES' in script
          assert 'az containerapp job start' not in workflow
          assert 'docker login' not in workflow
          assert 'docker push' not in workflow
          print('GHCR_AUTH_PROBE_OFFLINE_GUARD_PASS')
          PY
