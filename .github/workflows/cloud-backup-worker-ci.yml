name: Cloud backup worker build and auth guard CI

on:
  pull_request:
    paths:
      - 'scripts/azure-blob-backup.js'
      - 'test_cloud_backup_auth.js'
      - 'test_cloud_worker_image_policy.js'
      - 'test_cloud_worker_critical_triage.js'
      - 'scripts/assess-cloud-worker-critical.js'
      - 'ops/cloud-backup/**'
      - '.github/workflows/cloud-backup-worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Reinstall from immutable lockfile
        working-directory: ops/cloud-backup
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Block known high or critical npm advisories
        working-directory: ops/cloud-backup
        run: npm audit --omit=dev --audit-level=high

  managed-identity-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Syntax and credential isolation
        run: |
          node --check scripts/azure-blob-backup.js
          node --check test_cloud_backup_auth.js
          node --test test_cloud_backup_auth.js
          node --test test_cloud_worker_image_policy.js
          node --test test_cloud_worker_critical_triage.js
      - name: Never package secrets in public worker image
        run: |
          ! grep -Eq 'COPY[[:space:]]+(\\.|/|\.\./)' ops/cloud-backup/Dockerfile
          ! grep -Eq 'PGPASSWORD=|AZURE_STORAGE_KEY=|AGE_IDENTITY=' ops/cloud-backup/Dockerfile
          test -n "$(grep -E '^FROM .*@sha256:[0-9a-f]{64}' ops/cloud-backup/Dockerfile)"

  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable image (no cloud credentials)
        run: docker build -f ops/cloud-backup/Dockerfile -t campuspool-backup-ci:local .
      - name: Check Node, PostgreSQL 17 and AGE in isolated image
        run: |
          docker run --rm --network none --read-only \
            --entrypoint sh campuspool-backup-ci:local -c \
            'node --version && pg_dump --version && age --version && ! command -v postgres && ! command -v npm && ! command -v npx'
      - name: Verify unused privileged gosu helper is absent
        run: |
          docker run --rm --network none --read-only \
            --entrypoint sh campuspool-backup-ci:local -c \
            'test ! -e /usr/local/bin/gosu'
      - name: Verify missing secrets block any operator execution
        run: |
          if docker run --rm --network none --read-only \
            campuspool-backup-ci:local --execute; then
            echo "UNEXPECTED: cloud backup should block without credentials"
            exit 1
          fi
          echo "EXPECTED: no live export without secrets and explicit approval"

  image-os-vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build exact review image (no credentials)
        run: docker build -f ops/cloud-backup/Dockerfile -t campuspool-backup-security:ci .
      - name: Scan all OS and application packages (full severity report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-security:ci
          format: json
          output: trivy-backup-image.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize vulnerability evidence and fail if report is absent
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const scan=JSON.parse(fs.readFileSync('trivy-backup-image.json','utf8'));
          if(!Array.isArray(scan.Results)) throw Error('Trivy Results missing');
          const results=scan.Results.filter(x=>Array.isArray(x.Vulnerabilities));
          const all=results.flatMap(x=>x.Vulnerabilities.map(v=>({...v,Target:x.Target,Class:x.Class})));
          const by={};for(const v of all)by[v.Severity]=(by[v.Severity]||0)+1;
          const fixed=all.filter(v=>v.FixedVersion&&['CRITICAL','HIGH'].includes(v.Severity));
          const targets=results.map(r=>({target:r.Target,classification:r.Class,counts:r.Vulnerabilities.reduce((o,v)=>(o[v.Severity]=(o[v.Severity]||0)+1,o),{})}));
          const report=[
            '# Cloud backup worker: complete container vulnerability scan',
            'Image built from this PR; scan covers OS and application dependencies.',
            'Scan results: '+all.length+' advisories; severity counts '+JSON.stringify(by),
            'High/critical with a documented fix: '+fixed.length,
            'Counts by scanned target: '+JSON.stringify(targets),
            'Do not interpret a scan pass as a production release approval.',
          ];
          process.stdout.write(report.join('\n')+'\n');
          if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,report.join('\n')+'\n');
          NODE
      - name: Verify Bookworm zlib package does not contain the vulnerable MiniZip code
        run: |
          set -o pipefail
          docker run --rm -i --network none --read-only \
            --entrypoint sh campuspool-backup-security:ci -s \
            < ops/cloud-backup/verify-bookworm-zlib-minizip.sh \
            | tee zlib-minizip-proof.txt
          grep -Fxq 'BOOKWORM_ZLIB_MINIZIP_NOT_BUILT_PASS' zlib-minizip-proof.txt
      - name: Classify only the exact vendor-confirmed MiniZip scanner match
        run: |
          node scripts/assess-cloud-worker-critical.js \
            trivy-backup-image.json zlib-minizip-proof.txt
      - name: Generate CycloneDX SBOM for exact image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-security:ci
          format: cyclonedx
          output: trivy-backup-sbom.cdx.json
          skip-setup-trivy: true
          exit-code: '0'
      - name: Upload vulnerability report and SBOM for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuspool-cloud-backup-image-scan
          path: |
            trivy-backup-image.json
            trivy-backup-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Block deployable image while any high or critical vulnerability remains
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-security:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true

  alpine-candidate-cve-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Alpine 3.23 candidate (NOT APPROVED)
        run: docker build -f ops/cloud-backup/Dockerfile.alpine-candidate -t campuspool-backup-alpine-candidate:ci .
      - name: Capture official parent digest for immutable release planning
        run: docker buildx imagetools inspect node:22-alpine3.23 | head -n 14
      - name: Verify minimum runtime and remove all npm/PG server commands
        run: |
          docker run --rm --network none --read-only \
            --entrypoint sh campuspool-backup-alpine-candidate:ci -c \
            'node --version && pg_dump --version && age --version && ! command -v npm && ! command -v npx && ! command -v postgres'
      - name: Assert missing secrets cannot initiate export
        run: |
          if docker run --rm --network none --read-only \
            campuspool-backup-alpine-candidate:ci --execute; then
            echo "UNEXPECTED: candidate permitted export without credentials"; exit 1
          fi
          echo "PASS: candidate cannot export without protected config"
      - name: Scan full Alpine image OS and app packages
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-alpine-candidate:ci
          format: json
          output: trivy-backup-alpine-candidate.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Show vendor-related vulnerabilities without suppressing findings
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('trivy-backup-alpine-candidate.json','utf8'));
          if(!Array.isArray(data.Results))throw Error('Alpine Trivy Results missing');
          const all=data.Results.flatMap(r=>(r.Vulnerabilities||[]).map(v=>({...v,kind:r.Class})));
          const count={};for(const v of all)count[v.Severity]=(count[v.Severity]||0)+1;
          const high=all.filter(v=>['HIGH','CRITICAL'].includes(v.Severity));
          const lines=[
            'ALPINE_CANDIDATE_TOTAL '+all.length,
            'ALPINE_CANDIDATE_SEVERITIES '+JSON.stringify(count),
            'ALPINE_CANDIDATE_HIGH_CRITICAL '+high.length,
            'ALPINE_CANDIDATE_UNIQUE_HIGH_CRITICAL '+new Set(high.map(v=>v.VulnerabilityID)).size,
            'ALPINE_CANDIDATE_DETAILS '+JSON.stringify(high.map(v=>({
              cve:v.VulnerabilityID,package:v.PkgName,installed:v.InstalledVersion,
              fixed:v.FixedVersion||'',status:v.Status||'',severity:v.Severity
            }))),
            'NOT_DEPLOYABLE; REVIEW_AND_PIN_FINAL_DIGEST_FIRST'
          ];
          console.log(lines.join('\n'));
          if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Generate Alpine exact-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-alpine-candidate:ci
          format: cyclonedx
          output: trivy-backup-alpine-candidate-sbom.json
          skip-setup-trivy: true
          exit-code: '0'
      - name: Preserve candidate scan and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuspool-alpine-cve-candidate
          path: |
            trivy-backup-alpine-candidate.json
            trivy-backup-alpine-candidate-sbom.json
          if-no-files-found: warn
          retention-days: 14
