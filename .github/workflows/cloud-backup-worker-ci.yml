name: Cloud backup worker build and auth guard CI

on:
  pull_request:
    paths:
      - 'scripts/azure-blob-backup.js'
      - 'test_cloud_backup_auth.js'
      - 'test_cloud_worker_image_policy.js'
      - 'ops/cloud-backup/**'
      - '.github/workflows/cloud-backup-worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Reinstall from immutable lockfile
        working-directory: ops/cloud-backup
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Block known high or critical npm advisories
        working-directory: ops/cloud-backup
        run: npm audit --omit=dev --audit-level=high

  managed-identity-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Syntax and credential isolation
        run: |
          node --check scripts/azure-blob-backup.js
          node --check test_cloud_backup_auth.js
          node --test test_cloud_backup_auth.js
          node --test test_cloud_worker_image_policy.js
      - name: Never package secrets in public worker image
        run: |
          ! grep -Eq 'COPY[[:space:]]+(\\.|/|\.\./)' ops/cloud-backup/Dockerfile
          ! grep -Eq 'PGPASSWORD=|AZURE_STORAGE_KEY=|AGE_IDENTITY=' ops/cloud-backup/Dockerfile
          test -n "$(grep -E '^FROM .*@sha256:[0-9a-f]{64}' ops/cloud-backup/Dockerfile)"

  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable image (no cloud credentials)
        run: docker build -f ops/cloud-backup/Dockerfile -t campuspool-backup-ci:local .
      - name: Check Node, PostgreSQL 17 and AGE in isolated image
        run: |
          docker run --rm --network none --read-only \
            --entrypoint sh campuspool-backup-ci:local -c \
            'node --version && pg_dump --version && age --version && ! command -v postgres && ! command -v npm && ! command -v npx'
      - name: Verify unused privileged gosu helper is absent
        run: |
          docker run --rm --network none --read-only \
            --entrypoint sh campuspool-backup-ci:local -c \
            'test ! -e /usr/local/bin/gosu'
      - name: Verify missing secrets block any operator execution
        run: |
          if docker run --rm --network none --read-only \
            campuspool-backup-ci:local --execute; then
            echo "UNEXPECTED: cloud backup should block without credentials"
            exit 1
          fi
          echo "EXPECTED: no live export without secrets and explicit approval"

  image-os-vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build exact review image (no credentials)
        run: docker build -f ops/cloud-backup/Dockerfile -t campuspool-backup-security:ci .
      - name: Scan all OS and application packages (full severity report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-security:ci
          format: json
          output: trivy-backup-image.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize vulnerability evidence and fail if report is absent
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const scan=JSON.parse(fs.readFileSync('trivy-backup-image.json','utf8'));
          if(!Array.isArray(scan.Results)) throw Error('Trivy Results missing');
          const results=scan.Results.filter(x=>Array.isArray(x.Vulnerabilities));
          const all=results.flatMap(x=>x.Vulnerabilities.map(v=>({...v,Target:x.Target,Class:x.Class})));
          const by={};for(const v of all)by[v.Severity]=(by[v.Severity]||0)+1;
          const fixed=all.filter(v=>v.FixedVersion&&['CRITICAL','HIGH'].includes(v.Severity));
          const targets=results.map(r=>({target:r.Target,classification:r.Class,counts:r.Vulnerabilities.reduce((o,v)=>(o[v.Severity]=(o[v.Severity]||0)+1,o),{})}));
          const report=[
            '# Cloud backup worker: complete container vulnerability scan',
            'Image built from this PR; scan covers OS and application dependencies.',
            'Scan results: '+all.length+' advisories; severity counts '+JSON.stringify(by),
            'High/critical with a documented fix: '+fixed.length,
            'Counts by scanned target: '+JSON.stringify(targets),
            'Do not interpret a scan pass as a production release approval.',
          ];
          process.stdout.write(report.join('\n')+'\n');
          if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,report.join('\n')+'\n');
          NODE
      - name: Generate CycloneDX SBOM for exact image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-security:ci
          format: cyclonedx
          output: trivy-backup-sbom.cdx.json
          skip-setup-trivy: true
          exit-code: '0'
      - name: Upload vulnerability report and SBOM for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuspool-cloud-backup-image-scan
          path: |
            trivy-backup-image.json
            trivy-backup-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Block deployable image while any high or critical vulnerability remains
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-security:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true

  trixie-candidate-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated PostgreSQL 17 Trixie candidate (NOT DEPLOYABLE)
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('ops/cloud-backup/Dockerfile')
          text=p.read_text()
          old=next(line for line in text.splitlines() if line.startswith('FROM postgres:17-bookworm@sha256:'))
          assert len(old.rsplit(':',1)[-1])==64
          Path('/tmp/campuspool-trixie-candidate.Dockerfile').write_text(text.replace(old,'FROM postgres:17.11-trixie'))
          PY
          docker build -f /tmp/campuspool-trixie-candidate.Dockerfile -t campuspool-backup-trixie-candidate:ci .
      - name: Inspect trial source tag digest for reproducibility assessment
        run: docker buildx imagetools inspect postgres:17.11-trixie | head -n 15
      - name: Assess complete candidate OS and library vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-trixie-candidate:ci
          format: json
          output: trivy-backup-trixie-experiment.json
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize Trixie experiment only, not a release approval
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('trivy-backup-trixie-experiment.json'));
          if(!Array.isArray(report.Results))throw Error('Trivy Results missing');
          for(const r of report.Results) {
            const v=r.Vulnerabilities||[];
            const counts={};
            for(const x of v)counts[x.Severity]=(counts[x.Severity]||0)+1;
            process.stdout.write('EXPERIMENT_TARGET '+r.Target+' CLASS '+r.Class+' ADVISORIES '+v.length+' '+JSON.stringify(counts)+'\n');
          }
          NODE
      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuspool-trixie-candidate-scan
          path: trivy-backup-trixie-experiment.json
          retention-days: 7
          if-no-files-found: warn

  pgclient-candidate-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build client-only, nonrelease backup image
        run: docker build -f ops/cloud-backup/Dockerfile.pgclient-experiment -t campuspool-backup-client-candidate:ci .
      - name: Assert PostgreSQL 17 CLI + AGE + Node and no server
        run: |
          docker run --rm --network none --read-only \
            --entrypoint sh campuspool-backup-client-candidate:ci -c \
            'node --version && pg_dump --version && age --version && ! command -v postgres && ! command -v npm && ! command -v npx'
      - name: Ensure trial image blocks real export without secrets
        run: |
          if docker run --rm --network none --read-only campuspool-backup-client-candidate:ci --execute; then
            echo "UNEXPECTED: export was not blocked"
            exit 1
          fi
      - name: Scan exact client-only candidate OS and runtime libraries
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: campuspool-backup-client-candidate:ci
          format: json
          output: trivy-backup-pgclient-experiment.json
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '0'
      - name: Report trial OS package count and CVEs without waiving risk
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const scan=JSON.parse(fs.readFileSync('trivy-backup-pgclient-experiment.json','utf8'));
          if(!Array.isArray(scan.Results))throw Error('missing Trivy Results');
          let total=0;
          const lines=[];
          for(const r of scan.Results){
            const vulns=r.Vulnerabilities||[];
            total+=vulns.length;
            const severities={};
            for(const v of vulns)severities[v.Severity]=(severities[v.Severity]||0)+1;
            lines.push('CANDIDATE '+r.Target+' '+r.Class+' '+vulns.length+' '+JSON.stringify(severities));
            const critical=vulns.filter(v=>v.Severity==='CRITICAL').map(v=>v.PkgName+':'+v.VulnerabilityID);
            if(critical.length)lines.push('CANDIDATE_CRITICAL '+critical.join(','));
          }
          lines.push('CANDIDATE_TOTAL '+total+'; NONRELEASE; NO_APPROVED_WAIVERS');
          process.stdout.write(lines.join('\n')+'\n');
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Preserve nonrelease candidate security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuspool-pgclient-candidate-scan
          path: trivy-backup-pgclient-experiment.json
          retention-days: 7
          if-no-files-found: warn
