name: R2 encrypted streaming backup synthetic tests

on:
  pull_request:
    paths:
      - 'scripts/r2-stream-backup.js'
      - 'scripts/staging-backup-guard.js'
      - 'test_r2_stream_backup.js'
      - 'package.json'
      - '.github/workflows/r2-backup-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Check backup script syntax
        run: |
          node --check scripts/r2-stream-backup.js
          node --check test_r2_stream_backup.js
      - name: Test synthetic pipeline without Supabase or Cloudflare credentials
        run: npm run test:r2-backup
      - name: Verify preflight blocks missing operator secrets
        run: |
          if npm run check:r2-backup; then
            echo "ERROR: preflight unexpectedly succeeded without private setup"
            exit 1
          else
            echo "Expected: no-credential CI preflight blocks live backup"
          fi
