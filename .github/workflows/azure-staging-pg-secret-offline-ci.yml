name: Azure staging PG secret operator offline guard

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/azure-staging-pg-secret-operator.py'
      - 'test_azure_staging_pg_secret_operator.py'
      - 'test_azure_staging_data_identity_plan.py'
      - 'ops/cloud-backup/azure-staging-data-identity-operator.sh'
      - 'ops/cloud-backup/azure-staging-data-identity-rbac.sh'
      - '.github/workflows/azure-staging-pg-secret-offline-ci.yml'
  pull_request:
    paths:
      - 'scripts/azure-staging-pg-secret-operator.py'
      - 'test_azure_staging_pg_secret_operator.py'
      - 'test_azure_staging_data_identity_plan.py'
      - 'ops/cloud-backup/azure-staging-data-identity-operator.sh'
      - 'ops/cloud-backup/azure-staging-data-identity-rbac.sh'
      - '.github/workflows/azure-staging-pg-secret-offline-ci.yml'

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run zero-cloud safety regression
        run: |
          python3 -m py_compile scripts/azure-staging-pg-secret-operator.py test_azure_staging_pg_secret_operator.py
          python3 -m unittest -v test_azure_staging_pg_secret_operator.py
          python3 -m unittest -v test_azure_staging_data_identity_plan.py
          bash -n ops/cloud-backup/azure-staging-data-identity-operator.sh
          bash -n ops/cloud-backup/azure-staging-data-identity-rbac.sh
