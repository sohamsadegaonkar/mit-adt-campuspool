name: Staging Credential Validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STAGING_CREDENTIALS_READ_ONLY"
        required: true
        type: string
      authorize_admin_readonly:
        description: "Owner-approved staging admin metadata-only connection (no export)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-008-credential-validation
  cancel-in-progress: false

jobs:
  backup-credentials:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGING_CREDENTIALS_READ_ONLY'
    environment: staging-008-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      probe_uploaded: ${{ steps.upload.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Install tools before credentials are injected
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
      - name: Test staging URL, pinned CA, TLS and metadata permissions only
        id: database
        continue-on-error: true
        shell: bash
        env:
          APP_ENV: staging
          STAGING_CREDENTIAL_VALIDATION_ACK: STAGING_CREDENTIALS_READ_ONLY
          STAGING_VALIDATE_ADMIN: ${{ inputs.authorize_admin_readonly }}
          STAGING_BACKUP_DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          STAGING_BACKUP_CA_PEM_B64: ${{ secrets.STAGING_BACKUP_CA_PEM_B64 }}
          STAGING_008_BACKUP_ADMIN_ACK: ${{ secrets.STAGING_008_BACKUP_ADMIN_ACK }}
        run: |
          set -euo pipefail
          set +x
          node scripts/staging-008-credential-validation.js
      - name: Encrypt random synthetic challenge with configured public AGE recipient
        shell: bash
        env:
          STAGING_BACKUP_AGE_RECIPIENT: ${{ vars.STAGING_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          if ! [[ "$STAGING_BACKUP_AGE_RECIPIENT" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]; then
            echo "AGE_RECIPIENT_VALID=FAIL"; exit 1
          fi
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$RUNNER_TEMP/staging-credential-probe"
          head -c 64 /dev/urandom >"$TMP/probe"
          if ! age --encrypt --recipient "$STAGING_BACKUP_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/staging-credential-probe/probe.age" "$TMP/probe" 2>/dev/null; then
            echo "AGE_ENCRYPTION=FAIL"; exit 1
          fi
          sha256sum "$TMP/probe" | awk '{print $1}' >"$RUNNER_TEMP/staging-credential-probe/probe.sha256"
          echo "AGE_RECIPIENT_VALID=PASS"
          echo "AGE_ENCRYPTION=PASS"
          echo "SYNTHETIC_CHALLENGE_ONLY=YES"
      - name: Transfer only synthetic ciphertext and its expected digest
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-credential-probe
          path: ${{ runner.temp }}/staging-credential-probe/
          if-no-files-found: error
          retention-days: 1
      - name: Fail overall backup credential check if database test failed
        if: steps.database.outcome != 'success'
        run: exit 1

  restore-credentials:
    needs: backup-credentials
    if: always() && github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGING_CREDENTIALS_READ_ONLY' && needs.backup-credentials.outputs.probe_uploaded == 'success'
    environment: staging-008-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install AGE before private identity is injected
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-credential-probe
          path: ${{ runner.temp }}/staging-credential-probe/
      - name: Verify matching AGE identity using only synthetic ciphertext
        shell: bash
        env:
          STAGING_008_AGE_IDENTITY: ${{ secrets.STAGING_008_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          test -n "$STAGING_008_AGE_IDENTITY" || { echo "AGE_IDENTITY_VALID=FAIL"; exit 1; }
          printf '%s\n' "$STAGING_008_AGE_IDENTITY" >"$TMP/identity"
          unset STAGING_008_AGE_IDENTITY
          if ! age-keygen -y "$TMP/identity" >/dev/null 2>&1; then
            echo "AGE_IDENTITY_VALID=FAIL"; exit 1
          fi
          echo "AGE_IDENTITY_VALID=PASS"
          cd "$RUNNER_TEMP/staging-credential-probe"
          EXPECTED="$(cat probe.sha256)"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          if ! ACTUAL="$(age --decrypt --identity "$TMP/identity" probe.age 2>/dev/null | sha256sum | awk '{print $1}')"; then
            echo "AGE_KEY_PAIR_MATCH=FAIL"; exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "AGE_KEY_PAIR_MATCH=FAIL"; exit 1
          fi
          echo "AGE_DECRYPTION=PASS"
          echo "AGE_KEY_PAIR_MATCH=PASS"

  diagnostic-summary:
    needs: [backup-credentials, restore-credentials]
    if: always() && github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGING_CREDENTIALS_READ_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report bounded diagnostic status
        shell: bash
        env:
          BACKUP_RESULT: ${{ needs.backup-credentials.result }}
          RESTORE_RESULT: ${{ needs.restore-credentials.result }}
        run: |
          set -euo pipefail
          {
            echo '## Staging credential diagnostic'
            printf 'Backup credentials: %s\n\nRestore credentials: %s\n\n' "$BACKUP_RESULT" "$RESTORE_RESULT"
            echo 'No database writes, real export, write freeze, migration or deployment.'
            echo 'Environment protection policy and actual recovery require separate verification.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DATABASE_WRITES=NO"
          echo "REAL_DATABASE_EXPORT=NO"
          echo "MIGRATION_EXECUTED=NO"
          echo "PRODUCTION_TOUCHED=NO"
          test "$BACKUP_RESULT" = success && test "$RESTORE_RESULT" = success
