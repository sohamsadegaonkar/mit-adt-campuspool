name: CampusPool security smoke tests

on:
  pull_request:
    paths:
      - 'server.js'
      - 'index.html'
      - 'mobility-ui.js'
      - 'test_mobility_ui.js'
      - 'sms-provider.js'
      - 'render-staging.yaml'
      - 'test_auth_integration.js'
      - 'database.js'
      - 'idempotency.js'
      - 'test_idempotency.js'
      - 'test_browser_idempotency.js'
      - 'test_staging_migration_preflight.js'
      - 'test_staging_secure_backup.js'
      - 'test_staging_restore_compare.js'
      - 'scripts/staging-restore-compare.js'
      - 'scripts/staging-backup-guard.js'
      - 'scripts/staging-secure-backup.sh'
      - 'scripts/staging-migration-preflight.js'
      - 'render.yaml'
      - 'package.json'
      - 'test_security_smoke.js'
      - '.github/workflows/security-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify server and database syntax
        run: |
          node --check server.js
          node --check mobility-ui.js
          node --check test_mobility_ui.js
          node --check database.js
          node --check idempotency.js
          node --check test_idempotency.js
          node --check test_browser_idempotency.js
          node --check test_staging_migration_preflight.js
          node --check scripts/staging-migration-preflight.js
          node --check scripts/staging-backup-guard.js
          node --check test_staging_secure_backup.js
          node --check test_staging_restore_compare.js
          node --check scripts/staging-restore-compare.js
          bash -n scripts/staging-secure-backup.sh
          node --check test_security_smoke.js
          node --check test_auth_integration.js
          node --check sms-provider.js
      - name: Run isolated security tests
        run: |
          npm run test:mobility-ui
          npm run test:idempotency
          npm run test:browser-idempotency
          npm run test:staging-preflight
          npm run test:staging-backup
          npm run test:staging-restore-compare
          npm run test:security
          npm run test:auth
