name: Azure backup GHCR and ACR portability review

on:
  pull_request:
    paths:
      - 'ops/cloud-backup/containerapp-job.registry-portable.review.bicep'
      - 'scripts/review-registry-portability.js'
      - 'test_registry_portability.js'
      - '.github/workflows/azure-registry-portability-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-registry-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify GHCR default, ACR identity path and negative security tests
        run: |
          node --check scripts/review-registry-portability.js
          node --test test_registry_portability.js
          node scripts/review-registry-portability.js
      - name: Compile portable Bicep and check compiled ARM offline
        run: |
          command -v az
          az bicep build --file ops/cloud-backup/containerapp-job.registry-portable.review.bicep --stdout > /tmp/campuspool-portable-job.json
          node scripts/review-registry-portability.js --compiled /tmp/campuspool-portable-job.json
          echo 'GHCR_DEFAULT_AND_ACR_READY_COMPILE_PASS_NO_AZURE_CHANGES'
