name: Stage 1 PostgreSQL OTP tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'stage1-otp/**'
      - 'test_stage1_otp.js'
      - 'test_pg_identity.js'
      - 'test_pg_rides.js'
      - 'test_pg_rides_http.js'
      - 'test_pg_mobility.js'
      - 'test_pg_mobility_http.js'
      - 'test_mobility_geo.js'
      - 'test_production_auth.js'
      - 'test_release_gates.js'
      - 'scripts/**'
      - 'render.yaml'
      - 'index.html'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stage1-otp.yml'

permissions:
  contents: read

jobs:
  postgres-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stage1-ci-only
          POSTGRES_DB: campuspool_stage1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campuspool_stage1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OTP_DATABASE_URL: postgresql://postgres:stage1-ci-only@127.0.0.1:5432/campuspool_stage1_ci
      OTP_DB_SSL: "false"
      AUTH_OTP_BACKEND: postgres
      OTP_HMAC_KEY: stage1-ci-only-randomized-in-real-environments-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare disposable PostGIS schema
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.OTP_DATABASE_URL});await c.connect();try{await c.query('DROP EXTENSION IF EXISTS postgis CASCADE; CREATE SCHEMA IF NOT EXISTS extensions;')}finally{await c.end();}})().catch(e=>{console.error(e.message);process.exit(1)})"
      - name: Verify source syntax
        run: |
          node --check server.js
          node --check stage1-otp/pg-store.js
          node --check stage1-otp/auth-routes.js
          node --check stage1-otp/email-provider.js
          node --check stage1-otp/migrate.js
          node --check test_stage1_otp.js
          node --check stage1-otp/identity.js
          node --check test_pg_identity.js
          node --check stage1-otp/rides-store.js
          node --check stage1-otp/mobility-geo.js
          node --check stage1-otp/mobility-store.js
          node --check test_pg_mobility.js
          node --check test_mobility_geo.js
          node --check test_pg_mobility_http.js
          node --check test_pg_rides.js
          node --check test_pg_rides_http.js
          node --check test_production_auth.js
          node --check scripts/check-release-gates.js
          node --check test_release_gates.js
          node --check test_staging_isolation.js
      - name: Run isolated PostgreSQL integration tests
        run: |
          npm run test:stage1
          npm run test:identity
          npm run test:rides
          npm run test:rides-http
          npm run test:mobility-geo
          npm run test:mobility
          npm run test:mobility-http
          npm run test:native
          npm run test:staging
          npm run test:production-auth
          npm run test:release
          npm run check:release-ci
