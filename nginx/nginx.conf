# =========================================================================
# MIT ADT CampusPool - Nginx Production Reverse Proxy & Load Balancer
# Features:
# - Round-Robin & Least-Connections load distribution across app nodes
# - DDoS & Abuse Protection (Rate limiting per IP)
# - Real-time health checks & automatic node failover
# - Static asset caching with zero upstream overhead
# =========================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream: $upstream_addr ($upstream_response_time s)';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/manifest+json image/svg+xml;

    # Anti-Abuse Rate Limiting Zone (60 requests/minute per IP, burst up to 20)
    limit_req_zone $binary_remote_addr zone=campuspool_limit:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=campuspool_conn:10m;

    # =====================================================================
    # Upstream Backend Pool (Load Balancing across Multiple App Containers)
    # =====================================================================
    upstream campuspool_cluster {
        # Load Balancing Algorithm: least_conn (routes to least busy server)
        least_conn;

        # Keepalive connections to backend servers
        keepalive 32;

        server app-node-1:3000 max_fails=3 fail_timeout=10s;
        server app-node-2:3000 max_fails=3 fail_timeout=10s;
        server app-node-3:3000 max_fails=3 fail_timeout=10s;
    }

    # =====================================================================
    # Main HTTP Server (Port 80)
    # =====================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost mit-adt-campuspool.local;

        # Global Request Limits
        limit_conn campuspool_conn 20;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Reverse-Proxy-LB "Nginx-Least-Connections" always;

        # -----------------------------------------------------------------
        # Health Check Endpoint (Probed by cloud platforms and monitoring)
        # -----------------------------------------------------------------
        location /healthz {
            access_log off;
            proxy_pass http://campuspool_cluster/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # -----------------------------------------------------------------
        # Main Application Proxy (Passes to Load-Balanced Upstream)
        # -----------------------------------------------------------------
        location / {
            # Apply Rate Limiting
            limit_req zone=campuspool_limit burst=20 nodelay;

            proxy_pass http://campuspool_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose which backend node handled the request
            add_header X-Upstream-Backend $upstream_addr always;
            add_header X-Upstream-Time $upstream_response_time always;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
